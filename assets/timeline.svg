<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Trajetória: 2021 Técnico em Informática (Cotemig) → 2023 Assistente de Suporte de TI (Telefônica) → 2025 Técnico de Suporte Jr. (Fractalia) → 2025-atual Analista de Infraestrutura Jr. (JDC Consultoria, alocado na Prosegur)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081329"/>
      <stop offset="1" stop-color="#0d1f45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#7cc4ff" stop-opacity="1"/><stop offset="1" stop-color="#7cc4ff" stop-opacity="0"/></radialGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .draw { stroke-dasharray: 960; stroke-dashoffset: 960; animation: draw 2.2s ease-out .2s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      .pop { opacity: 0; animation: pop .7s cubic-bezier(.2,.8,.2,1) forwards; }
      @keyframes pop { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .n1 { animation-delay: .3s } .n2 { animation-delay: .9s } .n3 { animation-delay: 1.5s } .n4 { animation-delay: 2.1s }
      .date { font-size: 14px; font-weight: 700; fill: #7cc4ff; letter-spacing: 1.5px; }
      .role { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .org  { font-size: 14.5px; fill: #9fb4d6; }
      .tag  { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="318" rx="20" fill="url(#bg)" stroke="#2f5fb3" stroke-opacity=".45" stroke-width="1.5"/>
  <text x="40" y="48" font-size="13" font-weight="700" fill="#7cc4ff" letter-spacing="3">TRAJETÓRIA</text>
  <text x="1160" y="48" font-size="13" fill="#6b84ad" text-anchor="end">sempre no cliente Prosegur, via empresas de serviços de TI</text>

  <path d="M120 120 H1080" stroke="#1c3566" stroke-width="4" stroke-linecap="round"/>
  <path class="draw" d="M120 120 H1080" stroke="url(#line)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle r="14" cy="120" fill="url(#glow)" opacity=".9">
    <animate attributeName="cx" values="120;1080" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.9;.9;0" keyTimes="0;.1;.9;1" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- 1 -->
  <g class="pop n1">
    <circle cx="150" cy="120" r="11" fill="#081329" stroke="#22d3ee" stroke-width="3"/>
    <text x="150" y="172" text-anchor="middle" class="date">2021 – 2022</text>
    <text x="150" y="202" text-anchor="middle" class="role">Técnico em Informática</text>
    <text x="150" y="226" text-anchor="middle" class="org">Desenvolvimento Mobile · Cotemig</text>
    <rect x="105" y="250" width="90" height="24" rx="12" fill="#0f2550"/>
    <text x="150" y="266" text-anchor="middle" class="tag" fill="#7cc4ff">FORMAÇÃO</text>
  </g>

  <!-- 2 -->
  <g class="pop n2">
    <circle cx="450" cy="120" r="11" fill="#081329" stroke="#38bdf8" stroke-width="3"/>
    <text x="450" y="172" text-anchor="middle" class="date">02/2023 – 02/2025</text>
    <text x="450" y="202" text-anchor="middle" class="role">Assistente de Suporte de TI</text>
    <text x="450" y="226" text-anchor="middle" class="org">Telefônica Infraestrutura e Segurança</text>
    <rect x="390" y="250" width="120" height="24" rx="12" fill="#0f2550"/>
    <text x="450" y="266" text-anchor="middle" class="tag" fill="#7cc4ff">SUPORTE N1/N2</text>
  </g>

  <!-- 3 -->
  <g class="pop n3">
    <circle cx="750" cy="120" r="11" fill="#081329" stroke="#3b82f6" stroke-width="3"/>
    <text x="750" y="172" text-anchor="middle" class="date">02/2025 – 06/2025</text>
    <text x="750" y="202" text-anchor="middle" class="role">Técnico de Suporte Jr.</text>
    <text x="750" y="226" text-anchor="middle" class="org">Fractalia Brasil</text>
    <rect x="680" y="250" width="140" height="24" rx="12" fill="#0f2550"/>
    <text x="750" y="266" text-anchor="middle" class="tag" fill="#7cc4ff">AD · AZURE · INTUNE</text>
  </g>

  <!-- 4 (current) -->
  <g class="pop n4">
    <circle cx="1050" cy="120" r="12" fill="none" stroke="#8b5cf6" stroke-width="2">
      <animate attributeName="r" values="12;26" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="120" r="13" fill="url(#line)"/>
    <circle cx="1050" cy="120" r="5" fill="#ffffff"/>
    <text x="1050" y="172" text-anchor="middle" class="date">06/2025 – ATUAL</text>
    <text x="1050" y="202" text-anchor="middle" class="role">Analista de Infraestrutura Jr.</text>
    <text x="1050" y="226" text-anchor="middle" class="org">JDC Consultoria · Prosegur</text>
    <rect x="1000" y="250" width="100" height="24" rx="12" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".6"/>
    <circle cx="1016" cy="262" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="1056" y="266" text-anchor="middle" class="tag" fill="#4ade80">ATUAL</text>
  </g>
</svg>
